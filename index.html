<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Photo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            /* BACKGROUND IMAGE */
            background-color: lightblue;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Dark transparent layer over background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.25);

            z-index: -1;
        }

        .container {
            width: 400px;
            padding: 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 20px;

            color: #222;
        }

        /* Student photo */
        #studentPhoto {
            width: 180px;
            height: 220px;

            object-fit: cover;

            border: 4px solid #2196f3;
            border-radius: 10px;

            margin-bottom: 25px;

            display: none;
        }

        .input-box {
            width: 100%;

            padding: 15px;

            font-size: 16px;

            border: 2px solid #999;
            border-radius: 10px;

            outline: none;
        }

        .input-box:focus {
            border-color: #2196f3;
        }

        .button {
            width: 100%;
            height: 50px;

            margin-top: 20px;

            border: none;
            border-radius: 10px;

            background-color: #2196f3;

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            background-color: #1976d2;
        }

        #message {
            margin-top: 15px;

            color: red;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>STUDENT PHOTO</h1>

        <!-- Student photo appears here -->
        <img
            id="studentPhoto"
            alt="Student Photo"
        >

        <!-- Roll number -->
        <input
            type="text"
            id="rollNumber"
            class="input-box"
            placeholder="ENTER ROLL NUMBER"
            onkeydown="checkEnter(event)"
        >

        <!-- Button -->
        <button
            class="button"
            onclick="openPhoto()"
        >
            OPEN PHOTO
        </button>

        <div id="message"></div>

    </div>


    <script>

        function openPhoto() {

            let roll = document
                .getElementById("rollNumber")
                .value
                .trim()
                .toUpperCase();

            let photo = document.getElementById("studentPhoto");
            let message = document.getElementById("message");

            if (roll === "") {

                alert("Please enter Roll Number");

                return;
            }

            // Student photo URL
            let url =
                "https://erp.lbrce.ac.in/Admissions/Stu_Photo_Sign/P-" +
                roll +
                ".jpg";

            // Show photo in the same page
            photo.src = url;

            photo.style.display = "block";

            message.innerHTML = "";

            // Photo not found
            photo.onerror = function () {

                photo.style.display = "none";

                message.innerHTML =
                    "Student photo not found.";

            };

            // Photo loaded
            photo.onload = function () {

                message.innerHTML = "";

            };
        }


        // Press ENTER
        function checkEnter(event) {

            if (event.key === "Enter") {

                openPhoto();

            }
        }

    </script>

</body>
</html>
